<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pi SDK Test</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>
  <h2>🔐 Login with Pi</h2>
  <button onclick="authenticateUser()">Login</button>

  <pre id="output" style="background:#f5f5f5;padding:1em;margin-top:1em;"></pre>

  <script>
    const output = document.getElementById('output');
    const log = (msg) => {
      output.textContent += (typeof msg === 'string' ? msg : JSON.stringify(msg, null, 2)) + '\n';
    };

    Pi.init({
      version: "2.0",
      sandbox: true // חובה אם אתה ניגש מ-sandbox.minepi.com
    });
    log("✅ Pi.init called");

    async function authenticateUser() {
      log("🔁 Authenticating...");
      try {
        const scopes = ['username'];
        const result = await Pi.authenticate(scopes, onIncompletePaymentFound);
        log("✅ Got token:");
        log(result);

        // שליחת ה-token לשרת
        const serverRes = await fetch("/api/auth/pi", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ accessToken: result.accessToken })
        });

        const serverData = await serverRes.json();
        log("📥 Server response:");
        log(serverData);

      } catch (err) {
        log("❌ Auth error:");
        log(err.message || err);
      }
    }

    function onIncompletePaymentFound(payment) {
      log("⚠️ Incomplete payment:");
      log(payment);
    }
  </script>
</body>
</html>
