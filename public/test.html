<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pi Login</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>
  <button id="loginBtn">🔐 Login with Pi</button>

  <script>
    // אתחול Pi SDK
    Pi.init({
      version: "2.0",
      sandbox: true
    });

    document.getElementById('loginBtn').addEventListener('click', async () => {
      try {
        const scopes = ['username'];
        const result = await Pi.authenticate(scopes, onIncompletePaymentFound);
        
        // שולח את ה-accessToken לשרת
        const response = await fetch('/api/auth/pi', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ accessToken: result.accessToken })
        });

        const serverResponse = await response.json();
        console.log('✅ Server Response:', serverResponse);

        // אפשר לנתב את המשתמש לעמוד אחר אם תרצה:
        // window.location.href = '/dashboard';
      } catch (error) {
        console.error('❌ Auth/Login error:', error);
      }
    });

    function onIncompletePaymentFound(payment) {
      console.warn('⚠️ Incomplete payment:', payment);
    }
  </script>
</body>
</html>
