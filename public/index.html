<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pi SDK Test</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>
  <h1>Pi SDK Test Page</h1>
  <button id="authButton">Authenticate with Pi</button>
  <pre id="output"></pre>

  <script>
    const output = document.getElementById('output');
    const button = document.getElementById('authButton');

    button.onclick = async () => {
      try {
        output.textContent = 'Authenticating...';

        const scopes = ['username', 'payments']; // אפשר גם רק 'username' בשלב זה
        const result = await Pi.authenticate(scopes, onIncompletePaymentFound);

        output.textContent = '✅ Auth success:\n' + JSON.stringify(result, null, 2);
      } catch (error) {
        output.textContent = '❌ Auth error:\n' + error;
      }
    };

    function onIncompletePaymentFound(payment) {
      console.log('🔁 Incomplete payment found:', payment);
      // אתה יכול לטפל בזה כאן בעתיד
    }
  </script>
</body>
</html>
